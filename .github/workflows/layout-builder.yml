# Publishes tools/layout-builder.html to GitHub Pages as the site's index page.
#
# Before publishing, it checks that the page's token data still matches the
# Monkey C source, so a stale builder never goes out. If the check fails, run
# tools/build-layout-builder.py and commit the result.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.

name: Layout builder

on:
  push:
    branches: [main]
    paths:
      - tools/layout-builder.html
      - tools/build-layout-builder.py
      - source/Fields.mc
      - source/Config.mc
      - FIELDS.md
      - .github/workflows/layout-builder.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Upload and deploy run as two jobs, as in GitHub's own Pages starter workflow.
  # With both in one job, deploy-pages sometimes asked for the artifact before
  # the upload had registered and failed with 'No artifacts named "github-pages"
  # were found' - twice in three runs, with the artifact plainly there. By the
  # time a second job starts, the first job's artifacts are listed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the builder is in sync with the source
        run: python3 tools/build-layout-builder.py --check

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp tools/layout-builder.html _site/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
